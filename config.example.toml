# grid-watch — copia a config.toml y ajusta. Sin secretos aquí:
# las credenciales y el topic van en variables de entorno (ver .env.example).
timezone = "America/Lima"
state_path = "/var/lib/grid-watch/state.json"

[poll]
interval_s = 180

[grid]
nominal_v = 220
# down_below y ok_above se derivan del nominal (68% / 82%) si se omiten
min_sustain_s = 300

[alerts]
soc_critical = 20
stale_after_s = 1200
blind_after_s = 3600

[ntfy]
url = "https://ntfy.sh"
